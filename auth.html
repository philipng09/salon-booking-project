
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Đăng ký | SalonBook</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Header dùng chung -->
  <div id="shared-header"></div>

  <main class="auth-page">
    <section class="auth-card">

      <p class="auth-eyebrow">
        SALONBOOK / YOUR BEAUTY, YOUR TIME
      </p>

      <h1>Chào mừng đến SalonBook</h1>

      <p class="auth-subtitle">
        Đăng nhập để quản lý và đặt lịch salon.
      </p>

      <!-- Hai tab đăng nhập và đăng ký -->
      <div class="auth-tabs">
        <button
          type="button"
          id="login-tab"
          aria-selected="true">
          Đăng nhập
        </button>

        <button
          type="button"
          id="register-tab"
          aria-selected="false">
          Đăng ký
        </button>
      </div>

      <!-- Hiển thị thông báo -->
      <p id="auth-message" class="auth-message"
         role="status"></p>

      <!-- FORM ĐĂNG NHẬP -->
      <div id="login-panel">
        <form id="login-form" novalidate>

          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="Nhập email"
            autocomplete="username"
            required>

          <label for="login-password">
            Mật khẩu
          </label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required>

          <button type="submit" class="auth-submit">
            Đăng nhập
          </button>

        </form>
      </div>

      <!-- FORM ĐĂNG KÝ -->
      <div id="register-panel" hidden>
        <form id="register-form" novalidate>

          <label for="register-fullName">
            Họ và tên
          </label>
          <input
            type="text"
            id="register-fullName"
            name="fullName"
            placeholder="Nhập họ và tên"
            autocomplete="name"
            required>

          <label for="register-email">Email</label>
          <input
            type="email"
            id="register-email"
            name="email"
            placeholder="Nhập email"
            autocomplete="email"
            required>

          <label for="register-phone">
            Số điện thoại
          </label>
          <input
            type="tel"
            id="register-phone"
            name="phone"
            placeholder="Nhập số điện thoại"
            autocomplete="tel"
            required>

          <label for="register-password">
            Mật khẩu
          </label>
          <input
            type="password"
            id="register-password"
            name="password"
            placeholder="Tối thiểu 8 ký tự"
            autocomplete="new-password"
            required>

          <label for="register-confirmPassword">
            Xác nhận mật khẩu
          </label>
          <input
            type="password"
            id="register-confirmPassword"
            name="confirmPassword"
            placeholder="Nhập lại mật khẩu"
            autocomplete="new-password"
            required>

          <button type="submit" class="auth-submit">
            Tạo tài khoản
          </button>

        </form>
      </div>

      <p class="auth-note">
        Đây là bản demo phục vụ học tập.
        Không sử dụng mật khẩu thật.
      </p>

    </section>
  </main>

  <!-- Footer dùng chung -->
  <div id="shared-footer"></div>

  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>

</body>
</html>
